        function getMonday(now = new Date()) {
            const d = new Date(now), day = d.getDay(), m = new Date(d);
            if (day === 0) m.setDate(d.getDate() - 6);
            else if (day === 1) { if (d.getHours() < 10) m.setDate(d.getDate() - 7); }
            else m.setDate(d.getDate() - (day - 1));
            m.setHours(0, 0, 0, 0);
            return m;
        }

        function getRaidDates(mon) {
            return [2,3,4,5,6,7,8].map(i => { const d = new Date(mon); d.setDate(mon.getDate()+i); return d; });
        }

        function fmt(d) { return d.toISOString().split('T')[0]; }

        function timeAgo(ts) {
            const diff = Date.now() - ts;
            const m = Math.floor(diff/60000), h = Math.floor(diff/3600000), day = Math.floor(diff/86400000);
            if (diff < 60000) return '방금 전';
            if (h < 1) return `${m}분 전`;
            if (day < 1) return `${h}시간 전`;
            return `${day}일 전`;
        }
